name: Job alerts

on:
  schedule:
    - cron: "0 */3 * * *" # cada 3 horas (UTC)
  workflow_dispatch: # ejecución manual desde la pestaña Actions

permissions:
  contents: write # necesario para guardar data/seen_jobs.json

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Buscar y notificar ofertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
      - name: Guardar estado (git auto-commit)
        if: success()
        run: |
          git config user.name "curro-bot"
          git config user.email "curro-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "chore: actualizar ofertas vistas" && git push)
